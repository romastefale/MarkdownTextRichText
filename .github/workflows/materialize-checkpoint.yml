name: Materialize MDTXTRT checkpoint

on:
  push:
    branches:
      - feat/mdtxtrt-implementation

permissions:
  contents: write

concurrency:
  group: mdtxtrt-checkpoint-materialization
  cancel-in-progress: false

jobs:
  materialize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout implementation branch
        uses: actions/checkout@v4
        with:
          ref: feat/mdtxtrt-implementation
          fetch-depth: 0

      - name: Reconstruct and verify checkpoint
        shell: bash
        run: |
          set -euo pipefail
          archive="$(mktemp --suffix=.tar.xz)"
          tmp="$(mktemp -d)"
          cat .checkpoint/parts/p* | base64 --decode > "$archive"
          echo "79d71ec74214a6073b4da08c7aaac6965210ffb691d1754e589da76e75b854e0  $archive" | sha256sum --check --status
          tar -xJf "$archive" -C "$tmp"
          test "$(find "$tmp" -type f | wc -l | tr -d ' ')" = "35"
          TMPROOT="$tmp" python - <<'PY'
          import ast
          import hashlib
          import json
          import os
          from pathlib import Path

          root = Path(os.environ["TMPROOT"])
          manifest = json.loads((root / "docs/VERSION_MANIFEST.json").read_text(encoding="utf-8"))
          for entry in manifest["files"]:
              path = root / entry["path"]
              digest = hashlib.sha256(path.read_bytes()).hexdigest()
              if digest != entry["sha256"]:
                  raise SystemExit(f"SHA-256 divergente: {entry['path']}")

          python_files = sorted(root.rglob("*.py"))
          if len(python_files) != 26:
              raise SystemExit(f"Quantidade inesperada de arquivos Python: {len(python_files)}")
          for path in python_files:
              ast.parse(path.read_text(encoding="utf-8"), filename=str(path))
          print(f"manifest={len(manifest['files'])} python={len(python_files)}")
          PY
          node --check "$tmp/mdtxtrt/static/app.js"

          cp -a "$tmp"/. .
          rm -rf .checkpoint .github/workflows/materialize-checkpoint.yml

      - name: Commit exact checkpoint contents
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && { echo "No changes to commit"; exit 1; }
          git commit -m "feat: materialize MDTXTRT checkpoint 2026-09-13-v2"
          git push origin HEAD:feat/mdtxtrt-implementation
