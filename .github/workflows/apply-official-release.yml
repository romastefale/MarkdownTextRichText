name: Apply MDTXTRT official release tree

on:
  push:
    branches:
      - feat/mdtxtrt-official-release
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/mdtxtrt-official-release
          fetch-depth: 0

      - name: Reconstruct verified release tree
        run: |
          set -euo pipefail
          cat .release/part00 .release/part01 .release/part02 .release/part03 .release/part04 .release/part05 | base64 -d > /tmp/mdtxtrt-release.tar.xz
          echo 'c91aa747e32560eeabf4fc0ae7ea186428bc4f3f58a4d5a15a7d9a3b1dea3831  /tmp/mdtxtrt-release.tar.xz' | sha256sum -c -
          tar -xJf /tmp/mdtxtrt-release.tar.xz -C .

      - name: Apply verified aiogram model correction to release gate
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('scripts/release_gate.py')
          s = p.read_text(encoding='utf-8')
          s = s.replace('RichBlockTableCell(text="Recurso", is_header=True)', 'RichBlockTableCell(align="left", valign="middle", text="Recurso", is_header=True)')
          s = s.replace('RichBlockTableCell(text="Disponível", is_header=True)', 'RichBlockTableCell(align="center", valign="middle", text="Disponível", is_header=True)')
          s = s.replace('RichBlockTableCell(text="Tabela")', 'RichBlockTableCell(align="left", valign="middle", text="Tabela")')
          s = s.replace('RichBlockTableCell(text="Sim")', 'RichBlockTableCell(align="center", valign="middle", text="Sim")')
          p.write_text(s, encoding='utf-8')
          PY

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install runtime dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements.txt

      - name: Verify Python and JavaScript
        run: |
          python -m compileall -q mdtxtrt app.py scripts/release_gate.py
          node --check mdtxtrt/static/release.js

      - name: Run internal integration gate
        run: PYTHONPATH=. python scripts/release_gate.py

      - name: Start application and verify healthcheck
        env:
          PORT: '8765'
          MDTXTRT_DB: /tmp/mdtxtrt-release-ci.sqlite3
        run: |
          set -euo pipefail
          python app.py > /tmp/mdtxtrt-app.log 2>&1 &
          pid=$!
          trap 'kill "$pid" 2>/dev/null || true; cat /tmp/mdtxtrt-app.log' EXIT
          ok=0
          for n in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:8765/health > /tmp/health.json; then
              ok=1
              break
            fi
            sleep 1
          done
          test "$ok" = 1
          python - <<'PY'
          import json
          payload = json.load(open('/tmp/health.json', encoding='utf-8'))
          assert payload['ok'] is True
          assert payload['document_schema'] == 'mdtxtrt.document/v1'
          assert payload['bot'] is False
          print(json.dumps(payload, ensure_ascii=False, sort_keys=True))
          PY

      - name: Commit verified release tree
        run: |
          set -euo pipefail
          rm -rf .release
          rm -f .github/workflows/apply-official-release.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'feat: reconcile MDTXTRT official release contract'
          git push origin HEAD:feat/mdtxtrt-official-release
