name: Verify final product

on:
  push:
    branches: [release/mdtxtrt-final-v9]
  pull_request:
    branches: [release/mdtxtrt-final-v8]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install runtime
        run: python -m pip install -r requirements.txt
      - name: Compile Python
        run: python -m compileall -q mdtxtrt app.py tests
      - name: Run tests
        run: python -m unittest discover -s tests -v
      - name: Validate JavaScript syntax
        run: node --check mdtxtrt/static/release.js
      - name: Validate repository whitespace
        run: git diff --check HEAD^
