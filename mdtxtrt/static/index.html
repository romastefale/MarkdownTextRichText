<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>MDTXTRT</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link rel="stylesheet" href="/static/release.css">
</head>
<body>
<div id="app" class="app-shell">
  <section class="document-bar" aria-label="Documento">
    <div class="document-meta">
      <strong id="draftName" class="document-name">Novo documento</strong>
      <span id="saveState" class="save-state" aria-live="polite">local</span>
    </div>
    <div class="view-switch" role="tablist" aria-label="Modo">
      <button id="editTab" type="button" role="tab" aria-selected="true" class="active">Editar</button>
      <button id="previewTab" type="button" role="tab" aria-selected="false">Prévia</button>
    </div>
  </section>

  <section id="sessionBanner" class="banner hidden" aria-live="polite"></section>

  <main id="workspace" class="workspace">
    <section id="editorPane" class="pane" aria-label="Editor">
      <div id="editor" class="editor"></div>
      <button id="addParagraph" class="add-paragraph" type="button">+ texto</button>
    </section>

    <section id="previewPane" class="pane hidden" aria-label="Prévia Telegram">
      <div class="preview-header">
        <div>
          <strong>Prévia Telegram</strong>
          <span id="mechanismBadge" class="mechanism-badge">Aguardando</span>
        </div>
        <button id="refreshPreview" type="button">Atualizar</button>
      </div>
      <article id="telegramPreview" class="telegram-preview"></article>
      <section id="previewWarnings" class="preview-warnings hidden"></section>
      <details id="technicalPreview" class="technical-preview">
        <summary>Projeção técnica</summary>
        <pre id="projectionText"></pre>
      </details>
    </section>
  </main>
  <nav id="toolbar" class="toolbar" aria-label="Formatação">
    <button type="button" data-action="text" aria-label="Estilo de texto" title="Estilo de texto"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 5h16M12 5v15M8 20h8"/></svg></button>
    <span class="separator" aria-hidden="true"></span>
    <button type="button" data-inline="strong" aria-label="Negrito"><strong>B</strong></button>
    <button type="button" data-inline="em" aria-label="Itálico"><em>I</em></button>
    <button type="button" data-inline="u" aria-label="Sublinhado"><u>U</u></button>
    <button type="button" data-inline="sub" aria-label="Subscrito" title="Subscrito">x₂</button>
    <button type="button" data-inline="sup" aria-label="Sobrescrito" title="Sobrescrito">x²</button>
    <button type="button" data-block="list" aria-label="Lista">≡</button>
    <button type="button" data-block="blockquote" aria-label="Citação">❝</button>
    <button type="button" data-action="link" aria-label="Link">⌁</button>
    <button type="button" data-inline="code" aria-label="Código inline" title="Código inline">&lt;/&gt;</button>
    <button type="button" data-block="code" aria-label="Bloco de código" title="Bloco de código">{ }</button>
    <button id="moreButton" type="button" aria-label="Mais opções">+</button>
  </nav>
</div>

<input id="importFile" type="file" accept=".md,.txt,text/markdown,text/plain" hidden>
<input id="mediaFile" type="file" hidden>

<div id="modal" class="modal hidden" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
  <div class="modal-card">
    <header class="modal-head">
      <strong id="modalTitle"></strong>
      <button id="modalClose" type="button" aria-label="Fechar">×</button>
    </header>
    <div id="modalBody" class="modal-body"></div>
  </div>
</div>

<div id="toast" class="toast hidden" aria-live="polite">
  <span id="toastText"></span>
  <button id="toastUndo" type="button">Desfazer</button>
</div>

<script src="/static/release.js"></script>
<script src="/static/final-v10.js"></script>
</body>
</html>
